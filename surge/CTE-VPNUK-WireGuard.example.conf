# Example only. Merge the sections into your own Surge profile and replace
# every <...> placeholder with values from your personal WireGuard profile.

[General]
always-real-ip = *.3gppnetwork.org

[Proxy]
UK WireGuard = wireguard, section-name=cte-uk, test-timeout=8

[Proxy Group]
CTE Activation = select, "UK WireGuard"

[WireGuard cte-uk]
private-key = <YOUR_PRIVATE_KEY>
self-ip = <YOUR_TUNNEL_IPV4_ADDRESS_WITHOUT_PREFIX>
dns-server = <YOUR_DNS_SERVER>
mtu = <YOUR_MTU>
peer = (public-key = <SERVER_PUBLIC_KEY>, allowed-ips = "0.0.0.0/0, ::/0", endpoint = <SERVER_HOST>:<UDP_PORT>, preshared-key = <YOUR_PRESHARED_KEY>, keepalive = <KEEPALIVE_SECONDS>)

[Rule]
DOMAIN-SUFFIX,ctexcel.com,"CTE Activation"
DOMAIN-SUFFIX,cmlink.com,"CTE Activation"
DOMAIN,epdg.epc.mnc033.mcc234.pub.3gppnetwork.org,"CTE Activation"
DOMAIN,epdg.epc.mnc030.mcc234.pub.3gppnetwork.org,"CTE Activation"
DOMAIN,config.rcs.mnc011.mcc460.pub.3gppnetwork.org,"CTE Activation"
DOMAIN-SUFFIX,ee.co.uk,"CTE Activation"
DOMAIN,gspe1-ssl.ls.apple.com,"CTE Activation"
IP-CIDR,31.94.0.0/16,"CTE Activation",no-resolve
FINAL,DIRECT

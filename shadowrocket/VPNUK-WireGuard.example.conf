# Replace every <...> placeholder with values from your own WireGuard profile.
# Never publish the completed file.

[Interface]
PrivateKey = <YOUR_PRIVATE_KEY>
Address = <YOUR_TUNNEL_ADDRESS>
DNS = <YOUR_DNS_SERVER>
MTU = <YOUR_MTU>

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
PresharedKey = <YOUR_PRESHARED_KEY>
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = <SERVER_HOST>:<UDP_PORT>
PersistentKeepalive = <KEEPALIVE_SECONDS>
